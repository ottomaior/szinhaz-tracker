server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Everything Metro and the asset pipeline emit is content-hashed — the
  # filename changes whenever the bytes do — so these can be kept for a year
  # and never revalidated. Declared before `location /` only for readability;
  # nginx picks the longest matching prefix regardless of order.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The two files the app stores fetch to check that the native app is allowed
  # to open links to this domain. `scripts/write-well-known.ts` writes them into
  # `public/.well-known/`, which `expo export` copies here verbatim.
  #
  # This block exists for one reason: Apple fetches
  # `/.well-known/apple-app-site-association` — no extension — and requires it
  # served as `application/json`. nginx types a file by its extension, so
  # without this it goes out as the default `application/octet-stream` and
  # Apple's CDN rejects it silently. `default_type` inside the location is what
  # sets the type for a file the types map cannot name; assetlinks.json is typed
  # correctly by extension either way and is only here to share the block.
  #
  # `try_files ... =404` rather than falling through to `location /`: an absent
  # file must be a 404, not the app's index.html, or both stores would be
  # parsing a page of HTML and reporting something less obvious than "missing".
  location /.well-known/ {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Dynamic routes have one pre-rendered file per *route*, not per id, so the
  # rules below cannot find them by URL the way /discover finds discover.html —
  # /play/<uuid> fell through to /index.html and was served the feed's markup.
  # That is the same mismatch the try_files fix below was written for, and it
  # survived it: the client rendered a play page against the feed's HTML and
  # React threw the whole document away (#422).
  #
  # Both shells render an empty root, which is exactly what these screens render
  # before their data arrives, so hydration matches. Regex locations win over
  # prefix ones, so the no-cache header has to be repeated here rather than
  # inherited from `location /`.
  # One rule for every dynamic route, so adding a route means adding a word
  # here rather than copying a four-line block and hoping. The Dockerfile
  # produces `_shell.html` for each of these; see the note there about what
  # happens when the two halves disagree.
  location ~ ^/(play|user|person|list)/[^/]+/?$ {
    add_header Cache-Control "no-cache";
    try_files /$1/_shell.html /index.html;
  }

  location / {
    # `expo export` writes one pre-rendered file per route — sign-in.html,
    # discover.html — but the URLs that reach us have no extension. Without
    # the `$uri.html` step, /sign-in missed every branch and fell through to
    # /index.html, so nginx served the feed's HTML for every route in the app.
    # The client router then rendered the screen actually asked for, against
    # server markup for a different one: React failed to hydrate (#418), threw
    # the static HTML away and re-rendered from scratch (#422) on every page
    # except "/". Static rendering was being paid for and discarded.
    #
    # The final /index.html is still the right fallback for /play/<id>, which
    # has no pre-rendered file of its own — one exists per *route*, not per id.
    try_files $uri $uri.html $uri/index.html /index.html;

    # The pre-rendered HTML is the one thing whose URL outlives its contents,
    # so it has to revalidate: a browser holding yesterday's copy hydrates it
    # against today's JavaScript. That is not hypothetical — a /sign-in cached
    # before the try_files fix above kept failing long after the server was
    # serving the right document.
    #
    # This lives here rather than in a `location ~ \.html$` block, which was
    # the first attempt and silently did nothing: that regex is tested against
    # the request URI ("/discover"), not the file try_files resolves to, so it
    # never matched the extensionless URLs that are the whole point.
    add_header Cache-Control "no-cache";
  }
}
