<script id="vl-theme">
(function(){
  var KEY="vastaps.landing.theme", INK={"dark":"#0a0507","light":"#faf5ec"}, root=document.documentElement;
  function paint(t){
    root.setAttribute("data-theme",t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content",INK[t]||INK.dark);
  }
  var theme="dark";
  try{ theme=localStorage.getItem(KEY)||"dark" }catch(e){}
  if(theme!=="light") theme="dark";
  paint(theme);
  document.addEventListener("DOMContentLoaded",function(){
    var meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content",INK[theme]||INK.dark);
    Array.prototype.forEach.call(document.querySelectorAll("[data-theme-toggle]"),function(btn){
      btn.setAttribute("aria-pressed", theme==="light" ? "true" : "false");
      btn.addEventListener("click",function(){
        theme = theme==="dark" ? "light" : "dark";
        paint(theme);
        try{ localStorage.setItem(KEY,theme) }catch(e){}
        Array.prototype.forEach.call(document.querySelectorAll("[data-theme-toggle]"),function(b){
          b.setAttribute("aria-pressed", theme==="light" ? "true" : "false");
        });
      });
    });
  });
})();

/* ── The tokens are the generated block above, which index.html and the

   construction now, rather than by somebody keeping copies in step ─── */
:root {

}

  font-family: var(--vl-sans); font-size: var(--vl-size-copy); line-height: var(--vl-leading-copy);

}

:focus-visible { outline: 2px solid var(--vc-gold); outline-offset: 3px; border-radius: var(--vl-radius-sm); }

/* ── Chrome ─────────────────────────────────────────────────────────────── */

/* ── The pick screens: eleven cards, choose three ───────────────────────── */
.tally { position: sticky; top: 60px; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--vl-space-lg); padding: var(--vl-space-sm) var(--vl-space-lg); border-radius: var(--vl-radius-md); border: 1px solid var(--hairline); background: color-mix(in srgb, var(--vc-surface) 92%, transparent); backdrop-filter: blur(10px); font-size: var(--vl-size-caption); color: var(--vc-text-dim); }

@media (min-width: 560px) { .cards { grid-template-columns: 1fr 1fr; } }
.card { position: relative; display: flex; gap: var(--vl-space-md); align-items: center; padding: var(--vl-space-md) var(--vl-space-md); border-radius: var(--vl-radius-lg); border: 1px solid var(--hairline); background: var(--vc-bg-elevated); cursor: pointer; transition: border-color var(--vl-dur-state), background var(--vl-dur-state), opacity var(--vl-dur-state); user-select: none; }

        (q.hint ? '<p class="q__hint">' + esc(q.hint) + "</p>" : "") +
        chips(q.key, opts, chosen, q.multi) +
        (q.other ? '<input class="text text--sm" type="text" name="' + esc(q.key) + '_mas" maxlength="120" placeholder="' + esc(q.otherPrompt || "Mi?") + '" value="' + esc(b[q.key + "_mas"] || "") + '"' + (on ? "" : " hidden") + ">" : "") +
        "</div>";
    }).join("");
    return '<div class="step"><div class="step__head"><p class="eyebrow">1. Rólad · ' + screen + " / 3</p><h2>" + esc(ROLAD_HEADS[screen]) + "</h2></div>" + html + nav(true);
  }

  // A rating row: the feature, and the four answers.
  function rateRow(f) {
    var opts = RATING_ANSWERS.map(function (id) { return { id: id, label: RATING_LABELS[id] }; });
    var shot = f.shot ? ' <button type="button" class="linkish" data-shot="shots/' + esc(f.shot) + '">kép</button>' : "";
    return '<div class="miss miss--rate" data-rate="' + esc(f.id) + '"><div><div class="miss__label">' + esc(f.label) + shot + '</div><div class="miss__detail">' + esc(f.detail) + "</div></div>" +
      chips("r:" + f.id, opts, state.ratings[f.id], false) + "</div>";
  }

  function renderRate(step) {
    var groups = step.areas.map(function (areaId) {
      var area = AREAS.filter(function (a) { return a.id === areaId; })[0];
      var rows = FEATURES.filter(function (f) { return f.area === areaId; }).map(rateRow).join("");
      return '<h3 class="group">' + esc(area.label) + "</h3>" + rows;
    }).join("");
    return '<div class="step"><div class="step__head"><p class="eyebrow">2. Amit az app tud · ' + step.index + " / 2</p>" +
      "<h2>" + (step.index === 1 ? "Mennyit érnek neked ezek?" : "És ezek?") + "</h2>" +
      '<p class="dim">' + (step.index === 1
        ? "Egy válasz mindegyikhez. „Ezért nyitnám meg”: ez az, amiért elővennéd az appot. „Nem használnám”: nem baj, ha ott van, de te nem nyúlnál hozzá."
        : "Ugyanígy. A képre koppintva látod, hogy néz ki az appban.") + "</p></div>" +
      groups + nav(true);
  }

  function card(f, checked, disabled) {
    var thumb = f.shot
      ? '<span class="card__thumb"><img src="shots/' + esc(f.shot) + '" alt="" loading="lazy" width="44" height="60"></span>'
      : '<span class="card__thumb card__thumb--none" aria-hidden="true"></span>';
    return '<label class="card card--best"><input type="checkbox" name="best" value="' + esc(f.id) + '"' + (checked ? " checked" : "") + (disabled ? " disabled" : "") + ' aria-label="' + esc(f.label) + '">' +
      thumb + '<span class="card__text"><span class="card__label">' + esc(f.label) + '</span><span class="card__detail">' + esc(f.detail) + '</span></span>' +
      '<span class="card__mark" aria-hidden="true">' + CHECK + "</span></label>";
  }

  function renderBest() {
    var chosen = state.picks.best || [];
    var full = chosen.length >= PICK;
    var list = state.order.map(function (i) { return FEATURES[i]; });
    var cards = list.map(function (f) { return card(f, chosen.indexOf(f.id) >= 0, full && chosen.indexOf(f.id) < 0); }).join("");
    return '<div class="step"><div class="step__head"><p class="eyebrow">2. Amit az app tud · a három</p>' +
      "<h2>Melyik háromért vennéd elő leginkább?</h2>" +
      '<p class="dim">Mind a tizenhat jó lehet — most azt kérdezzük, melyik három az, amiért tényleg megnyitnád. Pontosan három.</p></div>' +
      '<div class="tally" aria-live="polite"><span>Ezért nyitnám meg</span><span><b id="tally-n">' + chosen.length + "</b> / " + PICK + "</span></div>" +
      '<div class="cards">' + cards + "</div>" + nav(true);
  }

  function renderMissing() {
    var opts = DESIGN.missingAnswers.map(function (id) { return { id: id, label: MISSING_LABELS[id] }; });
    var cards = MISSING.map(function (f) {
      return '<div class="miss" data-miss="' + esc(f.id) + '"><div><div class="miss__label">' + esc(f.label) + '</div><div class="miss__detail">' + esc(f.detail) + '</div></div>' +
        chips("m:" + f.id, opts, state.missing[f.id], false) + "</div>";
    }).join("");
    return '<div class="step"><div class="step__head"><p class="eyebrow">3. Ami még nincs</p><h2>Tíz dolog, ami még nincs benne. Melyik hiányozna?</h2>' +
      '<p class="dim">Egy válasz mindegyikhez. A „hiányozna” a fontos: az mondja meg, mi jöjjön a következő.</p></div>' +
      cards +
      '<div class="q"><p class="q__title">Mi más hiányzik?</p><p class="q__hint">Ami nincs a listán, de te elvárnád. Nem kötelező.</p>' +
      '<input class="text" type="text" name="missing_other" maxlength="' + MISSING_OTHER_MAX + '" placeholder="Egy-két szó is elég…" value="' + esc(state.missing_other || "") + '"></div>' +
      nav(true);
  }

  function renderZaras() {
    return '<div class="step"><div class="step__head"><p class="eyebrow">4. Végül</p><h2>Mitől használnád minden színházi este után?</h2></div>' +
      '<div class="q"><p class="q__hint">Egy mondat is elég. Az is válasz, hogy „semmitől”.</p>' +
      '<textarea class="text" name="open_answer" maxlength="1500" placeholder="Írd le a saját szavaiddal…">' + esc(state.open_answer || "") + "</textarea></div>" +
      '<div class="q"><label class="check"><input type="checkbox" name="optin"' + (state.optin ? " checked" : "") + '><span>Szóljatok, amikor elindul. <span class="faint">Egy e-mail, az indulásról, és semmi más.</span></span></label>' +
      '<input class="text text--sm" type="email" name="email" maxlength="254" autocomplete="email" placeholder="e-mail-cím" value="' + esc(state.email || "") + '"' + (state.optin ? "" : " hidden") + "></div>" +
      '<div class="hp" aria-hidden="true"><label>Weboldal <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>' +
      nav(true, null, true);
  }

  function renderThanks(already) {
    var url = "https://vastaps.app/kutatas";
    return '<div class="step thanks"><div class="step__head"><p class="eyebrow">Köszönjük</p>' +
      '<h1>' + (already ? "Ezt már beküldted." : "Megvan. Köszönjük!") + '</h1>' +
      '<p class="lede">' + (already ? "Ebből a böngészőből már érkezett válasz, és egy ember egy szavazat. Ha másvalaki töltené ki, más eszközön vagy privát ablakban megteheti." : "A legtöbbet most azzal segítesz, ha továbbküldöd egy ismerősödnek, aki jár színházba. Egy ember egy szavazat — és minden szavazat számít, amíg kevesen vagyunk.") + "</p></div>" +
      '<div class="thanks__acts"><button class="btn btn--gold" type="button" data-share data-url="' + url + '">Továbbküldöm</button>' +
      '<a class="btn btn--ghost" href="' + APP + '">Megnyitom az appot</a></div>' +
      '<p class="faint" id="share-note"></p></div>';
  }

  // ── Render & progress ──────────────────────────────────────────────────
  function render() {
    if (load(K_DONE)) { progress.hidden = true; root.innerHTML = renderThanks(true); return; }
    var step = steps[state.step];
    var html;
    if (step.kind === "intro") html = renderIntro();
    else if (step.kind === "rolad") html = renderRolad(step.screen);
    else if (step.kind === "rate") html = renderRate(step);
    else if (step.kind === "best") html = renderBest();
    else if (step.kind === "missing") html = renderMissing();
    else html = renderZaras();
    root.innerHTML = html;
    progress.hidden = state.step === 0;
    progressText.textContent = state.step + " / " + TOTAL;
    progressFill.style.width = Math.round((100 * state.step) / TOTAL) + "%";
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    var first = root.querySelector("h1, h2");
    if (first && state.step > 0) { first.setAttribute("tabindex", "-1"); first.focus({ preventScroll: true }); }
  }

  function showErr(msg) {
    var el = document.getElementById("err");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("is-on");
    el.scrollIntoView({ block: "nearest" });
  }

  // ── Reading answers back ───────────────────────────────────────────────
  function readBehaviour() {
    var b = state.behaviour;
    BEHAVIOUR.forEach(function (q) {
      var inputs = root.querySelectorAll('input[name="' + q.key + '"]');
      if (!inputs.length) return; // not on this screen
      if (q.multi) {
        var list = [];
        inputs.forEach(function (i) { if (i.checked) list.push(i.value); });
        b[q.key] = list;
      } else {
        var picked = null;
        inputs.forEach(function (i) { if (i.checked) picked = i.value; });
        if (picked !== null) b[q.key] = picked; else delete b[q.key];
      }
      if (q.other) {
        var el = root.querySelector('input[name="' + q.key + '_mas"]');
        var on = q.multi ? (b[q.key] || []).indexOf(q.other) >= 0 : b[q.key] === q.other;
        if (el) {
          el.hidden = !on;
          if (on) b[q.key + "_mas"] = el.value.trim().slice(0, 120);
          else { el.value = ""; delete b[q.key + "_mas"]; }
        }
      }
    });
    save(K_DRAFT, state);
  }

  function readRatings() {
    FEATURES.forEach(function (f) {
      var a = root.querySelector('input[name="r:' + f.id + '"]:checked');
      if (a) state.ratings[f.id] = a.value;
    });
    save(K_DRAFT, state);
  }

  function readBest() {
    var chosen = [];
    root.querySelectorAll('input[name="best"]:checked').forEach(function (i) { chosen.push(i.value); });
    state.picks.best = chosen;
    var full = chosen.length >= PICK;
    root.querySelectorAll('input[name="best"]').forEach(function (i) { i.disabled = full && !i.checked; });
    var n = document.getElementById("tally-n");
    if (n) n.textContent = chosen.length;
    save(K_DRAFT, state);
  }

  function readMissing() {
    MISSING.forEach(function (f) {
      var a = root.querySelector('input[name="m:' + f.id + '"]:checked');
      state.missing[f.id] = a ? a.value : null;
    });
    var o = root.querySelector('input[name="missing_other"]');
    state.missing_other = o ? o.value.trim().slice(0, MISSING_OTHER_MAX) : "";
    save(K_DRAFT, state);
  }

  function readZaras() {
    var t = root.querySelector('textarea[name="open_answer"]');
    var o = root.querySelector('input[name="optin"]');
    var e = root.querySelector('input[name="email"]');
    state.open_answer = t ? t.value.slice(0, 1500) : "";
    state.optin = !!(o && o.checked);
    state.email = e ? e.value.trim() : "";
    if (e) e.hidden = !state.optin;
    save(K_DRAFT, state);
  }

  // ── Validation per step ────────────────────────────────────────────────
  function validate(step) {
    var b = state.behaviour;
    if (step.kind === "rolad") {
      var qs = BEHAVIOUR.filter(function (q) { return q.screen === step.screen && q.required; });
      for (var i = 0; i < qs.length; i++) {
        var q = qs[i];
        var v = b[q.key];
        if (q.multi ? !(v || []).length : !v) return "Válaszolj erre is: „" + q.title + "”";
      }
    }
    if (step.kind === "rate") {
      var missingRow = null;
      FEATURES.forEach(function (f) {
        if (missingRow) return;
        if (step.areas.indexOf(f.area) >= 0 && !state.ratings[f.id]) missingRow = f;
      });
      if (missingRow) return "Mindegyikhez válassz egyet — „" + missingRow.label + "” még hiányzik.";
    }
    if (step.kind === "best") {
      var n = (state.picks.best || []).length;
      if (n !== PICK) return "Pontosan hármat válassz — most " + n + " van kijelölve.";
    }
    if (step.kind === "missing") {
      for (var j = 0; j < MISSING.length; j++) {
        if (!state.missing[MISSING[j].id]) return "Mind a tíznél válaszolj — „" + MISSING[j].label + "” még hiányzik.";
      }
    }
    if (step.kind === "zaras") {
      if (state.optin && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email)) return "Ha szeretnéd, hogy szóljunk, kell egy működő e-mail-cím — vagy vedd ki a pipát.";
    }
    return null;
  }

  // ── Submit ─────────────────────────────────────────────────────────────
  function payload() {
    var hp = root.querySelector('input[name="website"]');
    return {
      version: DESIGN.version,
      client_id: clientId,
      source: state.source || null,
      behaviour: state.behaviour,
      ratings: state.ratings,
      picks: { best: state.picks.best },
      missing: state.missing,
      missing_other: state.missing_other || null,
      open_answer: state.open_answer || null,
      email: state.optin ? state.email : null,
      website: hp ? hp.value : ""
    };
  }

  function submit(btn) {
    btn.disabled = true;
    btn.textContent = "Küldés…";
    fetch(RPC, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ payload: payload() })
    }).then(function (res) {
      return res.text().then(function (text) {
        var body = null;
        try { body = JSON.parse(text); } catch (e) {}
        if (res.ok) return { ok: true };
        if (body && body.code === "23505") return { ok: true, already: true };
        var msg = body && body.message ? body.message : "HTTP " + res.status;
        throw new Error(msg);
      });
    }).then(function (r) {
      save(K_DONE, { at: new Date().toISOString(), client: clientId });
      drop(K_DRAFT);
      progress.hidden = true;
      root.innerHTML = renderThanks(!!r.already);
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = "Beküldöm";
      var m = String(err && err.message || "");
      showErr(m.indexOf("too many") >= 0
        ? "Most sokan küldenek egyszerre — várj egy percet, és próbáld újra. A válaszaid megvannak."
        : "Nem sikerült beküldeni (" + m + "). A válaszaid ebben a böngészőben megmaradnak — próbáld újra kicsit később.");
    });
  }

  // ── Events ─────────────────────────────────────────────────────────────
  function readCurrent() {
    var step = steps[state.step];
    if (step.kind === "rolad") readBehaviour();
    else if (step.kind === "rate") readRatings();
    else if (step.kind === "best") readBest();
    else if (step.kind === "missing") readMissing();
    else if (step.kind === "zaras") readZaras();
  }
  root.addEventListener("change", readCurrent);
  root.addEventListener("input", function (e) {
    if (!e.target) return;
    if (e.target.name === "open_answer" || e.target.name === "email" || e.target.name === "missing_other" || e.target.type === "text") readCurrent();
  });
  root.addEventListener("click", function (e) {
    var t = e.target.closest("button, a");
    if (!t) return;
    if (t.hasAttribute("data-next")) {
      readCurrent();
      var step = steps[state.step];
      var problem = validate(step);
      if (problem) { showErr(problem); return; }
      state.step = Math.min(state.step + 1, steps.length - 1);
      save(K_DRAFT, state);
      render();
    } else if (t.hasAttribute("data-back")) {
      readCurrent();
      state.step = Math.max(state.step - 1, 0);
      save(K_DRAFT, state);
      render();
    } else if (t.hasAttribute("data-submit")) {
      readZaras();
      var p = validate(steps[state.step]);
      if (p) { showErr(p); return; }
      submit(t);
    } else if (t.hasAttribute("data-shot")) {
      e.preventDefault();
      var d = document.getElementById("shot");
      document.getElementById("shot-img").src = t.getAttribute("data-shot");
      if (d.showModal) d.showModal(); else window.open(t.getAttribute("data-shot"), "_blank");
    } else if (t.hasAttribute("data-share")) {
      var url = t.getAttribute("data-url");
      var note = document.getElementById("share-note");
      var text = "Egy magyar színházi app készül — öt perc, névtelenül: mi ér valamit benne, és mi hiányzik még?";
      if (navigator.share) {
        navigator.share({ title: "Vastaps kérdőív", text: text, url: url }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text + " " + url).then(function () { note.textContent = "A link a vágólapon van — illeszd be egy üzenetbe."; }, function () { note.textContent = url; });
      } else {
        note.textContent = url;
      }
    }
  });
  document.getElementById("shot-close").addEventListener("click", function () { document.getElementById("shot").close(); });
  document.getElementById("shot").addEventListener("click", function (e) { if (e.target === e.currentTarget) e.currentTarget.close(); });

  render();
})();
</script>
</body>
</html>
