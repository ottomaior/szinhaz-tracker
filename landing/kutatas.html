/* ── Tokens — the same as index.html, so the two pages are one house ─── */
:root {
  color-scheme: dark;
  --ink: #0a0507; --ink-2: #0f0709;
  --surface: #170b0f; --surface-2: #1c0d13; --surface-3: #2a1520;
  --hairline: rgba(245,237,228,0.10); --hairline-soft: rgba(245,237,228,0.055);
  --text: #f6efe6; --dim: #c2afa8; --faint: #9f8e8a;
  --gold: #e4bf72; --gold-deep: #a97c2e; --gold-lift: #f0d38f; --on-gold: #140709;
  --gold-tint: rgba(228,191,114,0.14); --gold-edge: rgba(228,191,114,0.42); --gold-glow: rgba(228,191,114,0.40);
  --claret: #7a2433; --claret-edge: rgba(168,57,77,0.6); --claret-tint: rgba(122,36,51,0.22);
  --display: "Bodoni Moda", "Bodoni MT", "Didot", "Times New Roman", serif;
  --sans: "Sora", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --step--1: clamp(0.78rem, 0.76rem + 0.10vw, 0.84rem);
  --step-0: clamp(0.98rem, 0.94rem + 0.18vw, 1.08rem);
  --step-1: clamp(1.15rem, 1.06rem + 0.42vw, 1.38rem);
  --step-2: clamp(1.45rem, 1.24rem + 0.95vw, 2.05rem);
  --step-3: clamp(1.95rem, 1.48rem + 2.10vw, 3.20rem);
  --gutter: clamp(1.15rem, 4vw, 2.5rem);
  --shell: 720px;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--sans); font-size: var(--step-0); line-height: 1.6;
  -webkit-font-smoothing: antialiased; min-height: 100svh;
  display: flex; flex-direction: column;
}
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 500; line-height: 1.08; letter-spacing: -0.015em; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.shell { width: 100%; max-width: var(--shell); margin-inline: auto; padding-inline: var(--gutter); }
.eyebrow { font-size: var(--step--1); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
.lede { color: var(--dim); font-size: var(--step-1); font-weight: 300; line-height: 1.55; }
.dim { color: var(--dim); }
.faint { color: var(--faint); font-size: var(--step--1); }

/* ── Chrome ─────────────────────────────────────────────────────────────── */
.nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 86%, transparent); backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--hairline-soft); }
.nav__in { display: flex; align-items: center; gap: 1rem; height: 60px; }
.brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; margin-right: auto; }
.brand__mark { width: 24px; height: 24px; }
.brand__name { font-family: var(--display); font-size: 1.18rem; font-weight: 600; }
.progress { display: flex; align-items: center; gap: 0.7rem; font-size: var(--step--1); color: var(--faint); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.progress[hidden] { display: none; }
.progress__bar { width: 96px; height: 2px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
.progress__fill { height: 100%; width: 0; background: var(--gold); transition: width 0.35s cubic-bezier(0.22,0.8,0.3,1); }

main { flex: 1; padding-block: clamp(2rem, 6vw, 4rem) clamp(3rem, 8vw, 5rem); }
.step { display: flex; flex-direction: column; gap: 1.6rem; animation: rise 0.36s cubic-bezier(0.22,0.8,0.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .step { animation: none; } }
.step__head { display: flex; flex-direction: column; gap: 0.7rem; }
.step__head h1 { font-size: var(--step-3); }
.step__head h2 { font-size: var(--step-2); }

/* ── Questions ──────────────────────────────────────────────────────────── */
.q { display: flex; flex-direction: column; gap: 0.7rem; padding-top: 1.35rem; border-top: 1px solid var(--hairline-soft); }
.q:first-of-type { border-top: 0; padding-top: 0; }
.q__title { font-weight: 600; font-size: var(--step-0); }
.q__hint { color: var(--faint); font-size: var(--step--1); margin-top: -0.35rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip { position: relative; display: inline-flex; align-items: center; min-height: 42px; padding: 0.45rem 0.95rem; border-radius: 999px; border: 1px solid var(--hairline); background: rgba(245,237,228,0.03); color: var(--dim); cursor: pointer; transition: border-color 0.18s, background 0.18s, color 0.18s; user-select: none; }
.chip:hover { border-color: var(--gold-edge); color: var(--text); }
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chip:has(input:checked) { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 600; }
.chip:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 3px; }
.text { width: 100%; min-height: 46px; padding: 0.65rem 0.9rem; border-radius: 12px; border: 1px solid var(--hairline); background: var(--surface); color: var(--text); font-size: 16px; }
.text:focus { border-color: var(--gold-edge); outline: none; }
textarea.text { min-height: 120px; resize: vertical; line-height: 1.5; }
.text--sm { max-width: 320px; margin-top: 0.3rem; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* ── The pick screens: twelve cards, choose three ───────────────────────── */
.tally { position: sticky; top: 60px; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.6rem 0.9rem; border-radius: 12px; border: 1px solid var(--hairline); background: color-mix(in srgb, var(--surface-2) 92%, transparent); backdrop-filter: blur(10px); font-size: var(--step--1); color: var(--dim); }
.tally b { font-family: var(--display); font-size: 1.35rem; font-weight: 500; color: var(--gold); letter-spacing: 0; }
.tally--worst b { color: #e08a9a; }
.cards { display: grid; gap: 0.6rem; grid-template-columns: 1fr; }
@media (min-width: 560px) { .cards { grid-template-columns: 1fr 1fr; } }
.card { position: relative; display: flex; gap: 0.85rem; align-items: center; padding: 0.75rem 0.85rem; border-radius: 14px; border: 1px solid var(--hairline); background: var(--surface); cursor: pointer; transition: border-color 0.18s, background 0.18s, opacity 0.18s; user-select: none; }
.card:hover { border-color: var(--gold-edge); }
.card input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.card:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 3px; }
.card:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
.card:has(input:disabled) input { cursor: not-allowed; }
.card--best:has(input:checked) { border-color: var(--gold); background: var(--gold-tint); }
.card--worst:has(input:checked) { border-color: var(--claret-edge); background: var(--claret-tint); }
.card__thumb { flex: none; width: 44px; height: 60px; border-radius: 6px; overflow: hidden; border: 1px solid var(--hairline); background: var(--surface-3); }
.card__thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.card__thumb--none { background: linear-gradient(160deg, var(--surface-3), var(--surface)); }
.card__text { min-width: 0; flex: 1; }
.card__label { font-weight: 600; line-height: 1.3; display: block; }
.card__detail { color: var(--dim); font-size: var(--step--1); line-height: 1.45; margin-top: 0.15rem; display: block; }
.card__mark { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--faint); display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; }
.card__mark svg { width: 14px; height: 14px; opacity: 0; }
.card--best:has(input:checked) .card__mark { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.card--worst:has(input:checked) .card__mark { background: var(--claret); border-color: var(--claret); color: var(--text); }
.card:has(input:checked) .card__mark svg { opacity: 1; }
.shots { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; color: var(--faint); font-size: var(--step--1); }
.shots button { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid var(--hairline); background: transparent; color: var(--dim); font-size: 0.8rem; cursor: zoom-in; }
.shots button:hover { border-color: var(--gold-edge); color: var(--text); }

/* ── "If this were missing" ─────────────────────────────────────────────── */
.miss { display: flex; flex-direction: column; gap: 0.7rem; padding: 0.95rem 1.05rem 1.05rem; border: 1px solid var(--hairline); border-radius: 14px; background: var(--surface); }
.miss__label { font-weight: 600; }
.miss__detail { color: var(--dim); font-size: var(--step--1); margin-top: 0.1rem; }
.miss .chip { min-height: 38px; padding: 0.3rem 0.8rem; font-size: 0.9rem; }
.miss .chip:has(input:checked) { background: var(--surface-3); border-color: var(--gold-edge); color: var(--text); font-weight: 600; }
.miss .chip:has(input[value="zavarna"]:checked) { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }

/* ── Buttons ────────────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 46px; padding: 0.7rem 1.35rem; border-radius: 999px; font-size: 0.95rem; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: transform 0.16s, background 0.2s, border-color 0.2s, box-shadow 0.2s; }
.btn--gold { background: var(--gold); color: var(--on-gold); }
.btn--gold:hover { background: var(--gold-lift); box-shadow: 0 8px 34px -12px var(--gold-glow); }
.btn--gold:disabled { opacity: 0.6; cursor: wait; box-shadow: none; }
.btn--ghost { border-color: var(--hairline); color: var(--text); background: rgba(245,237,228,0.03); }
.btn--ghost:hover { border-color: var(--gold-edge); background: var(--gold-tint); }
.btn--text { background: transparent; color: var(--dim); padding-inline: 0.6rem; }
.btn--text:hover { color: var(--text); }
.actions { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-top: 0.5rem; }
.err { display: none; color: #f0a5b0; font-size: var(--step--1); padding: 0.7rem 0.9rem; border: 1px solid rgba(240,165,176,0.35); border-radius: 10px; background: rgba(122,36,51,0.16); }
.err.is-on { display: block; }

/* ── Intro & thanks ─────────────────────────────────────────────────────── */
.facts { display: grid; gap: 0.6rem; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.fact { padding: 0.9rem 1rem; border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface); }
.fact b { display: block; font-family: var(--display); font-size: var(--step-2); color: var(--gold); font-weight: 500; line-height: 1.1; }
.fact span { color: var(--dim); font-size: var(--step--1); }
.consent { color: var(--dim); font-size: var(--step--1); line-height: 1.5; padding: 0.8rem 1rem; border-left: 2px solid var(--gold-edge); background: rgba(245,237,228,0.03); border-radius: 0 10px 10px 0; }
.consent a { color: var(--gold); }
.check { position: relative; display: flex; gap: 0.75rem; align-items: flex-start; cursor: pointer; }
.check input { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--gold); }
.thanks h1 { font-size: var(--step-3); }
.thanks__acts { display: flex; flex-wrap: wrap; gap: 0.7rem; }

dialog { border: 0; padding: 0; background: transparent; max-width: min(92vw, 420px); }
dialog::backdrop { background: rgba(5,2,3,0.82); backdrop-filter: blur(6px); }
dialog img { width: 100%; height: auto; border-radius: 22px; border: 1px solid var(--hairline); display: block; }
dialog button { position: absolute; top: -14px; right: -14px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--hairline); background: var(--surface-3); cursor: pointer; }

.foot { border-top: 1px solid var(--hairline-soft); padding-block: 1.6rem 2.2rem; background: var(--ink-2); color: var(--faint); font-size: 0.85rem; }
.foot__in { display: flex; flex-wrap: wrap; gap: 0.6rem 1.4rem; justify-content: space-between; }
.foot a { color: var(--dim); text-decoration: none; }
.foot a:hover { color: var(--gold); }

@media (max-width: 480px) {
  .card__thumb { width: 38px; height: 52px; }
  .actions { flex-wrap: wrap; }
}
</style>

ett színházakról","detail":"Szólunk, ha egy követett színház vagy alkotó új darabot jelent be, vagy közeledik egy előadás a kívánságlistádról."},{"id":"baratok","label":"Az ismerőseid értékelése a darab oldalán","detail":"Látod, kik látták már azok közül, akiket követsz, és mit gondoltak."},{"id":"beugro","label":"Ki játszott aznap este","detail":"A naplóbejegyzésben rögzíted az aznapi szereposztást, beugróval együtt."},{"id":"hely_ar_jegy","label":"Ülőhely, jegyár és jegyfotó a bejegyzésben","detail":"Hol ültél, mennyibe került, és egy fotó a jegyről."},{"id":"listak","label":"Szerkesztői listák","detail":"Kézzel válogatott listák a katalógusból, amiket böngészhetsz."},{"id":"evad","label":"Évadösszegzés","detail":"Szeptembertől augusztusig: hány este, melyik színházak, mennyi jegy, kik játszottak a legtöbbször."}],"missingAnswers":["zavarna","mindegy","jobb_nelkule"],"missingLabels":{"zavarna":"Zavarna","mindegy":"Nem tűnne fel","jobb_nelkule":"Jobb is lenne nélküle"}}</script>

  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var s = "";
    for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
    return s;
  }
  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  var clientId = load(K_CLIENT);
  if (!clientId) { clientId = uuid(); save(K_CLIENT, clientId); }

  var source = null;
  try { source = new URLSearchParams(location.search).get("s"); } catch (e) {}

  var state = load(K_DRAFT) || {
    step: 0,
    // The twelve in a fresh order for each respondent, so the top of the
    // list cannot masquerade as the top of the ranking.
    order: shuffled(FEATURES.map(function (_, i) { return i; })),
    behaviour: {},
    picks: { best: [], worst: [] },
    missing: {},
    open_answer: "",
    optin: false,
    email: "",
    source: source
  };
  if (source && !state.source) state.source = source;

  // ── Steps ──────────────────────────────────────────────────────────────
  var steps = [{ kind: "intro" }, { kind: "rolad1" }, { kind: "rolad2" }, { kind: "best" }, { kind: "worst" }, { kind: "missing" }, { kind: "zaras" }];
  var TOTAL = steps.length - 1; // the intro is not a step

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function chips(name, options, chosen, multi) {
    return '<div class="chips" role="group">' + options.map(function (o) {
      var on = multi ? (chosen || []).indexOf(o.id) >= 0 : chosen === o.id;
      return '<label class="chip"><input type="' + (multi ? "checkbox" : "radio") + '" name="' + name + '" value="' + esc(o.id) + '"' + (on ? " checked" : "") + '>' + esc(o.label) + "</label>";
    }).join("") + "</div>";
  }

  function renderIntro() {
    return '<div class="step">' +
      '<div class="step__head"><p class="eyebrow">Kérdőív · színházba járóknak</p>' +
      '<h1>Mi kell egy színházi naplóba, és mi nem?</h1>' +
      '<p class="lede">A Vastaps egy magyar színházi app: műsor Budapest és Debrecen színházaiból, és egy napló arról, mit láttál. Mielőtt elindul, szeretnénk tudni, mi számít valójában — neked.</p></div>' +
      '<div class="facts"><div class="fact"><b>5 perc</b><span>Először rólad, aztán a funkciókról.</span></div>' +
      '<div class="fact"><b>Névtelen</b><span>Nem kérünk nevet, és nem kell fiók.</span></div>' +
      '<div class="fact"><b>Nem osztályzat</b><span>Választani kell — mi a legértékesebb, és mi maradhat ki.</span></div></div>' +
      '<p class="dim">Nincs jó válasz. Ha valamit nem használnál, az pont olyan hasznos, mint ha igen — sőt.</p>' +
      '<p class="consent">A válaszokat névtelenül tároljuk. E-mail-címet csak akkor, ha a végén kéred, hogy szóljunk az indulásról, és csak arra használjuk. <a href="' + PRIVACY + '" target="_blank" rel="noopener">Adatkezelési tájékoztató</a></p>' +
      '<div class="actions"><span></span><button class="btn btn--gold" type="button" data-next>Kezdjük</button></div></div>';
  }

  function renderRolad1() {
    var b = state.behaviour;
    return '<div class="step"><div class="step__head"><p class="eyebrow">1. Rólad</p><h2>Hogyan jársz színházba?</h2></div>' +
      '<div class="q"><p class="q__title">Hányszor voltál színházban az elmúlt egy évben?</p>' +
      chips("gyakorisag", [{ id: "0", label: "Egyszer sem" }, { id: "1-2", label: "1–2" }, { id: "3-5", label: "3–5" }, { id: "6-10", label: "6–10" }, { id: "10+", label: "Több mint 10" }], b.gyakorisag, false) + "</div>" +
      '<div class="q"><p class="q__title">Hol jársz színházba?</p><p class="q__hint">Több is lehet.</p>' +
      chips("varos", [{ id: "budapest", label: "Budapest" }, { id: "debrecen", label: "Debrecen" }, { id: "mas", label: "Máshol" }], b.varos, true) +
      '<input class="text text--sm" type="text" name="varos_mas" maxlength="80" placeholder="Hol máshol?" value="' + esc(b.varos_mas || "") + '"' + ((b.varos || []).indexOf("mas") >= 0 ? "" : " hidden") + "></div>" +
      '<div class="q"><p class="q__title">Melyik színházakban jártál az elmúlt egy évben?</p><p class="q__hint">Amelyikben voltál. Ha egyikben sem, hagyd üresen.</p>' +
      chips("szinhazak", [
        { id: "orkeny", label: "Örkény" }, { id: "katona", label: "Katona" }, { id: "nemzeti", label: "Nemzeti" }, { id: "central", label: "Centrál" },
        { id: "madach", label: "Madách" }, { id: "vig", label: "Vígszínház" }, { id: "csokonai", label: "Csokonai (Debrecen)" }, { id: "vojtina", label: "Vojtina (Debrecen)" }, { id: "mas", label: "Más színház" }
      ], b.szinhazak, true) +
      '<input class="text text--sm" type="text" name="szinhazak_mas" maxlength="120" placeholder="Melyik?" value="' + esc(b.szinhazak_mas || "") + '"' + ((b.szinhazak || []).indexOf("mas") >= 0 ? "" : " hidden") + "></div>" +
      '<div class="err" id="err"></div>' +
      '<div class="actions"><button class="btn btn--text" type="button" data-back>Vissza</button><button class="btn btn--gold" type="button" data-next>Tovább</button></div></div>';
  }

  function renderRolad2() {
    var b = state.behaviour;
    return '<div class="step"><div class="step__head"><p class="eyebrow">1. Rólad</p><h2>Hogyan választasz, és mire emlékszel?</h2></div>' +
      '<div class="q"><p class="q__title">Honnan tudod meg, mi megy?</p><p class="q__hint">Amit tényleg használsz — több is lehet.</p>' +
      chips("forras", [
        { id: "szinhaz_honlap", label: "A színház honlapja" }, { id: "jegyiroda", label: "jegy.hu, jegyiroda" }, { id: "facebook", label: "Facebook, Instagram" },
        { id: "portalok", label: "port.hu, szinhaz.hu, kritikák" }, { id: "ismerosok", label: "Ismerősök" }, { id: "hirlevel", label: "Hírlevél, bérlet" },
        { id: "plakat", label: "Plakát, az utcán" }, { id: "egyeb", label: "Egyéb" }
      ], b.forras, true) + "</div>" +
      '<div class="q"><p class="q__title">Mi dönti el, mit nézel meg?</p><p class="q__hint">A két-három legfontosabb.</p>' +
      chips("dontes", [
        { id: "darab", label: "A darab vagy a szerző" }, { id: "szinesz", label: "Egy színész" }, { id: "rendezo", label: "A rendező" }, { id: "szinhaz", label: "A színház maga" },
        { id: "ajanlas", label: "Valaki ajánlotta" }, { id: "kritika", label: "Kritika, értékelés" }, { id: "ar", label: "Az ár" }, { id: "datum", label: "Amikor ráérek" }
      ], b.dontes, true) + "</div>" +
      '<div class="q"><p class="q__title">Hogyan tartod számon, mit láttál?</p>' +
      chips("nyilvantartas", [
        { id: "fejben", label: "Fejben" }, { id: "jegyek_fuzetek", label: "Megőrzöm a jegyeket, műsorfüzeteket" }, { id: "jegyzet", label: "Jegyzetappban" },
        { id: "tablazat", label: "Táblázatban" }, { id: "kozossegi", label: "Posztolok róla" }, { id: "masik_app", label: "Egy másik appban" }, { id: "semmi", label: "Sehogy" }
      ], b.nyilvantartas, true) +
      '<input class="text text--sm" type="text" name="nyilvantartas_mas" maxlength="80" placeholder="Melyik appban?" value="' + esc(b.nyilvantartas_mas || "") + '"' + ((b.nyilvantartas || []).indexOf("masik_app") >= 0 ? "" : " hidden") + "></div>" +
      '<div class="q"><p class="q__title">Használsz naplóappot filmre vagy könyvre?</p>' +
      chips("analog_app", [{ id: "letterboxd", label: "Letterboxd" }, { id: "goodreads", label: "Goodreads, Moly" }, { id: "imdb", label: "IMDb" }, { id: "egyik_sem", label: "Egyiket sem" }], b.analog_app, true) + "</div>" +
      '<div class="err" id="err"></div>' +
      '<div class="actions"><button class="btn btn--text" type="button" data-back>Vissza</button><button class="btn btn--gold" type="button" data-next>Tovább</button></div></div>';
  }

  function card(f, kind, checked, disabled) {
    var thumb = f.shot
      ? '<span class="card__thumb"><img src="shots/' + esc(f.shot) + '" alt="" loading="lazy" width="44" height="60"></span>'
      : '<span class="card__thumb card__thumb--none" aria-hidden="true"></span>';
    return '<label class="card card--' + kind + '"><input type="checkbox" name="' + kind + '" value="' + esc(f.id) + '"' + (checked ? " checked" : "") + (disabled ? " disabled" : "") + ' aria-label="' + esc(f.label) + '">' +
      thumb + '<span class="card__text"><span class="card__label">' + esc(f.label) + '</span><span class="card__detail">' + esc(f.detail) + '</span></span>' +
      '<span class="card__mark" aria-hidden="true">' + (kind === "best" ? CHECK : CROSS) + "</span></label>";
  }

  function shotButtons(list) {
    var withShot = list.filter(function (f) { return f.shot; });
    if (!withShot.length) return "";
    return '<div class="shots"><span>Így néz ki az appban:</span>' + withShot.map(function (f) {
      return '<button type="button" data-shot="shots/' + esc(f.shot) + '">' + esc(f.label) + "</button>";
    }).join("") + "</div>";
  }

  function renderPick(kind) {
    var chosen = state.picks[kind] || [];
    var full = chosen.length >= PICK;
    var list = state.order.map(function (i) { return FEATURES[i]; });
    if (kind === "worst") list = list.filter(function (f) { return state.picks.best.indexOf(f.id) < 0; });
    var cards = list.map(function (f) {
      var on = chosen.indexOf(f.id) >= 0;
      return card(f, kind, on, full && !on);
    }).join("");
    var best = kind === "best";
    return '<div class="step"><div class="step__head"><p class="eyebrow">2. Funkciók · ' + (best ? "1 / 2" : "2 / 2") + '</p>' +
      '<h2>' + (best ? "Melyik három ér neked a legtöbbet?" : "És a maradékból melyik három maradhat ki?") + '</h2>' +
      '<p class="dim">' + (best
        ? "Tizenkét dolog, amit az app tud. Válaszd ki azt a hármat, amiért a leginkább elővennéd."
        : "Ami maradt, abból válaszd ki azt a hármat, amit észre sem vennél, ha az indulásból kimaradna.") + "</p></div>" +
      '<div class="tally' + (best ? "" : " tally--worst") + '" aria-live="polite"><span>' + (best ? "Legértékesebb" : "Kimaradhat") + '</span><span><b id="tally-n">' + chosen.length + "</b> / " + PICK + "</span></div>" +
      '<div class="cards">' + cards + "</div>" +
      (best ? shotButtons(list) : "") +
      '<div class="err" id="err"></div>' +
      '<div class="actions"><button class="btn btn--text" type="button" data-back>Vissza</button><button class="btn btn--gold" type="button" data-next>Tovább</button></div></div>';
  }

  function renderMissing() {
    var opts = DESIGN.missingAnswers.map(function (id) { return { id: id, label: MISSING_LABELS[id] }; });
    var cards = MISSING.map(function (f) {
      return '<div class="miss" data-miss="' + esc(f.id) + '"><div><div class="miss__label">' + esc(f.label) + '</div><div class="miss__detail">' + esc(f.detail) + '</div></div>' +
        chips("m:" + f.id, opts, state.missing[f.id], false) + "</div>";
    }).join("");
    return '<div class="step"><div class="step__head"><p class="eyebrow">3. Ha kimaradna</p><h2>Ha ez a hat az induláskor még nem lenne benne — mit éreznél?</h2>' +
      '<p class="dim">Egy válasz mindegyikhez. A „zavarna” a fontos: az mondja meg, mi nélkül nem szabad elindulni.</p></div>' +
      cards + '<div class="err" id="err"></div>' +
      '<div class="actions"><button class="btn btn--text" type="button" data-back>Vissza</button><button class="btn btn--gold" type="button" data-next>Tovább</button></div></div>';
  }

  function renderZaras() {
    return '<div class="step"><div class="step__head"><p class="eyebrow">4. Végül</p><h2>Mitől használnád minden színházi este után?</h2></div>' +
      '<div class="q"><p class="q__hint">Egy mondat is elég. Az is válasz, hogy „semmitől”.</p>' +
      '<textarea class="text" name="open_answer" maxlength="1500" placeholder="Írd le a saját szavaiddal…">' + esc(state.open_answer || "") + "</textarea></div>" +
      '<div class="q"><label class="check"><input type="checkbox" name="optin"' + (state.optin ? " checked" : "") + '><span>Szóljatok, amikor elindul. <span class="faint">Egy e-mail, az indulásról, és semmi más.</span></span></label>' +
      '<input class="text text--sm" type="email" name="email" maxlength="254" autocomplete="email" placeholder="e-mail-cím" value="' + esc(state.email || "") + '"' + (state.optin ? "" : " hidden") + "></div>" +
      '<div class="hp" aria-hidden="true"><label>Weboldal <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>' +
      '<div class="err" id="err"></div>' +
      '<div class="actions"><button class="btn btn--text" type="button" data-back>Vissza</button><button class="btn btn--gold" type="button" data-submit>Beküldöm</button></div></div>';
  }

  function renderThanks(already) {
    var url = "https://vastaps.pages.dev/kutatas";
    return '<div class="step thanks"><div class="step__head"><p class="eyebrow">Köszönjük</p>' +
      '<h1>' + (already ? "Ezt már beküldted." : "Megvan. Köszönjük!") + '</h1>' +
      '<p class="lede">' + (already ? "Ebből a böngészőből már érkezett válasz, és egy ember egy szavazat. Ha másvalaki töltené ki, más eszközön vagy privát ablakban megteheti." : "A legtöbbet most azzal segítesz, ha továbbküldöd egy ismerősödnek, aki jár színházba. Egy ember egy szavazat — és minden szavazat számít, amíg kevesen vagyunk.") + "</p></div>" +
      '<div class="thanks__acts"><button class="btn btn--gold" type="button" data-share data-url="' + url + '">Továbbküldöm</button>' +
      '<a class="btn btn--ghost" href="' + INVITE + '">Kérek meghívót az appba</a></div>' +
      '<p class="faint" id="share-note"></p></div>';
  }

  // ── Render & progress ──────────────────────────────────────────────────
  function render() {
    if (load(K_DONE)) { progress.hidden = true; root.innerHTML = renderThanks(true); return; }
    var step = steps[state.step];
    var html;
    if (step.kind === "intro") html = renderIntro();
    else if (step.kind === "rolad1") html = renderRolad1();
    else if (step.kind === "rolad2") html = renderRolad2();
    else if (step.kind === "best" || step.kind === "worst") html = renderPick(step.kind);
    else if (step.kind === "missing") html = renderMissing();
    else html = renderZaras();
    root.innerHTML = html;
    progress.hidden = state.step === 0;
    progressText.textContent = state.step + " / " + TOTAL;
    progressFill.style.width = Math.round((100 * state.step) / TOTAL) + "%";
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    var first = root.querySelector("h1, h2");
    if (first && state.step > 0) { first.setAttribute("tabindex", "-1"); first.focus({ preventScroll: true }); }
  }

  function showErr(msg) {
    var el = document.getElementById("err");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("is-on");
    el.scrollIntoView({ block: "nearest" });
  }

  // ── Reading answers back ───────────────────────────────────────────────
  function readBehaviour() {
    var b = state.behaviour;
    root.querySelectorAll("input[type=radio][name], input[type=checkbox][name]").forEach(function (i) {
      if (i.name === "optin" || i.name.indexOf(":") >= 0 || i.name === "best" || i.name === "worst") return;
      if (i.type === "radio") { if (i.checked) b[i.name] = i.value; }
      else {
        var list = b[i.name] = (b[i.name] || []).filter(function (v) { return v !== i.value; });
        if (i.checked) list.push(i.value);
      }
    });
    root.querySelectorAll("input[type=text][name]").forEach(function (i) {
      if (i.name === "website") return;
      b[i.name] = i.value.trim().slice(0, 120);
    });
    // Free-text fields follow their "other" chip.
    var pairs = { varos_mas: ["varos", "mas"], szinhazak_mas: ["szinhazak", "mas"], nyilvantartas_mas: ["nyilvantartas", "masik_app"] };
    Object.keys(pairs).forEach(function (k) {
      var el = root.querySelector('input[name="' + k + '"]');
      if (!el) return;
      var on = (b[pairs[k][0]] || []).indexOf(pairs[k][1]) >= 0;
      el.hidden = !on;
      if (!on) { el.value = ""; delete b[k]; }
    });
    save(K_DRAFT, state);
  }

  function readPick(kind) {
    var chosen = [];
    root.querySelectorAll('input[name="' + kind + '"]:checked').forEach(function (i) { chosen.push(i.value); });
    state.picks[kind] = chosen;
    // Choosing the top three again invalidates a leave-out list that may
    // now contain one of them.
    if (kind === "best") state.picks.worst = (state.picks.worst || []).filter(function (id) { return chosen.indexOf(id) < 0; });
    var full = chosen.length >= PICK;
    root.querySelectorAll('input[name="' + kind + '"]').forEach(function (i) { i.disabled = full && !i.checked; });
    var n = document.getElementById("tally-n");
    if (n) n.textContent = chosen.length;
    save(K_DRAFT, state);
  }

  function readMissing() {
    MISSING.forEach(function (f) {
      var a = root.querySelector('input[name="m:' + f.id + '"]:checked');
      state.missing[f.id] = a ? a.value : null;
    });
    save(K_DRAFT, state);
  }

  function readZaras() {
    var t = root.querySelector('textarea[name="open_answer"]');
    var o = root.querySelector('input[name="optin"]');
    var e = root.querySelector('input[name="email"]');
    state.open_answer = t ? t.value.slice(0, 1500) : "";
    state.optin = !!(o && o.checked);
    state.email = e ? e.value.trim() : "";
    if (e) e.hidden = !state.optin;
    save(K_DRAFT, state);
  }

  // ── Validation per step ────────────────────────────────────────────────
  function validate(step) {
    var b = state.behaviour;
    if (step.kind === "rolad1") {
      if (!b.gyakorisag) return "Válaszd ki, hányszor voltál színházban.";
      if (!(b.varos || []).length) return "Jelöld meg, hol jársz színházba.";
    }
    if (step.kind === "rolad2") {
      if (!(b.forras || []).length) return "Jelöld meg, honnan tudod meg, mi megy.";
      if (!(b.dontes || []).length) return "Jelöld meg, mi dönti el, mit nézel meg.";
      if (!(b.nyilvantartas || []).length) return "Jelöld meg, hogyan tartod számon, mit láttál.";
    }
    if (step.kind === "best" || step.kind === "worst") {
      var n = (state.picks[step.kind] || []).length;
      if (n !== PICK) return "Pontosan hármat válassz — most " + n + " van kijelölve.";
    }
    if (step.kind === "missing") {
      for (var i = 0; i < MISSING.length; i++) {
        if (!state.missing[MISSING[i].id]) return "Mind a hatnál válaszolj — „" + MISSING[i].label + "” még hiányzik.";
      }
    }
    if (step.kind === "zaras") {
      if (state.optin && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email)) return "Ha szeretnéd, hogy szóljunk, kell egy működő e-mail-cím — vagy vedd ki a pipát.";
    }
    return null;
  }

  // ── Submit ─────────────────────────────────────────────────────────────
  function payload() {
    var hp = root.querySelector('input[name="website"]');
    return {
      version: 2,
      client_id: clientId,
      source: state.source || null,
      behaviour: state.behaviour,
      picks: { best: state.picks.best, worst: state.picks.worst },
      missing: state.missing,
      open_answer: state.open_answer || null,
      email: state.optin ? state.email : null,
      website: hp ? hp.value : ""
    };
  }

  function submit(btn) {
    btn.disabled = true;
    btn.textContent = "Küldés…";
    fetch(RPC, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ payload: payload() })
    }).then(function (res) {
      return res.text().then(function (text) {
        var body = null;
        try { body = JSON.parse(text); } catch (e) {}
        if (res.ok) return { ok: true };
        if (body && body.code === "23505") return { ok: true, already: true };
        var msg = body && body.message ? body.message : "HTTP " + res.status;
        throw new Error(msg);
      });
    }).then(function (r) {
      save(K_DONE, { at: new Date().toISOString(), client: clientId });
      drop(K_DRAFT);
      progress.hidden = true;
      root.innerHTML = renderThanks(!!r.already);
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = "Beküldöm";
      var m = String(err && err.message || "");
      showErr(m.indexOf("too many") >= 0
        ? "Most sokan küldenek egyszerre — várj egy percet, és próbáld újra. A válaszaid megvannak."
        : "Nem sikerült beküldeni (" + m + "). A válaszaid ebben a böngészőben megmaradnak — próbáld újra kicsit később.");
    });
  }

  // ── Events ─────────────────────────────────────────────────────────────
  root.addEventListener("change", function () {
    var step = steps[state.step];
    if (step.kind === "rolad1" || step.kind === "rolad2") readBehaviour();
    else if (step.kind === "best" || step.kind === "worst") readPick(step.kind);
    else if (step.kind === "missing") readMissing();
    else if (step.kind === "zaras") readZaras();
  });
  root.addEventListener("input", function (e) {
    if (e.target && (e.target.name === "open_answer" || e.target.name === "email")) readZaras();
    if (e.target && e.target.type === "text") readBehaviour();
  });
  root.addEventListener("click", function (e) {
    var t = e.target.closest("button, a");
    if (!t) return;
    if (t.hasAttribute("data-next")) {
      var step = steps[state.step];
      if (step.kind === "zaras") readZaras();
      var problem = validate(step);
      if (problem) { showErr(problem); return; }
      state.step = Math.min(state.step + 1, steps.length - 1);
      save(K_DRAFT, state);
      render();
    } else if (t.hasAttribute("data-back")) {
      state.step = Math.max(state.step - 1, 0);
      save(K_DRAFT, state);
      render();
    } else if (t.hasAttribute("data-submit")) {
      readZaras();
      var p = validate(steps[state.step]);
      if (p) { showErr(p); return; }
      submit(t);
    } else if (t.hasAttribute("data-shot")) {
      var d = document.getElementById("shot");
      document.getElementById("shot-img").src = t.getAttribute("data-shot");
      if (d.showModal) d.showModal(); else window.open(t.getAttribute("data-shot"), "_blank");
    } else if (t.hasAttribute("data-share")) {
      var url = t.getAttribute("data-url");
      var note = document.getElementById("share-note");
      var text = "Egy magyar színházi app készül — öt perc, névtelenül: mi kell bele, és mi nem?";
      if (navigator.share) {
        navigator.share({ title: "Vastaps kérdőív", text: text, url: url }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text + " " + url).then(function () { note.textContent = "A link a vágólapon van — illeszd be egy üzenetbe."; }, function () { note.textContent = url; });
      } else {
        note.textContent = url;
      }
    }
  });
  document.getElementById("shot-close").addEventListener("click", function () { document.getElementById("shot").close(); });
  document.getElementById("shot").addEventListener("click", function (e) { if (e.target === e.currentTarget) e.currentTarget.close(); });

  render();
})();
</script>
</body>
</html>
