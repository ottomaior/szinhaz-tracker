<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Vastaps — megosztókártya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,ital,wght@6..96,0,400..700;6..96,1,400..700&family=Sora:wght@300;400;500;600&display=swap">
<style>
/* ── The share card ───────────────────────────────────────────────────────
   1200×630, rendered once by `npm run og` into landing/og.png. This is the
   only picture of Vastaps most people will ever see: it is what a link to
   the page becomes inside Facebook, Messenger, Slack, iMessage and X, and
   those previews are cropped, scaled and often shown at a third of this
   size. So the type is set larger than a page would set it, the phone is
   held clear of every edge a platform is known to trim, and nothing that
   matters sits in the outer 40px.

   The palette and the two typefaces are the landing page's own, because a
   preview that does not look like the page it opens is a broken promise. */
* { box-sizing: border-box; margin: 0; }

html, body { width: 1200px; height: 630px; overflow: hidden; }

body {
  position: relative;
  background: #0a0507;
  color: #f6efe6;
  font-family: "Sora", system-ui, sans-serif;
  display: flex;
  align-items: center;
  gap: 56px;
  padding: 0 74px;
  -webkit-font-smoothing: antialiased;
}

/* The same rig as the hero: two beams from above and a pool of warm light
   on the floor, with the phone standing in it. */
.rig { position: absolute; inset: 0; pointer-events: none; }
.beam {
  position: absolute; top: -22%; left: 74%; width: 420px; height: 150%;
  background: linear-gradient(to bottom, rgba(228,191,114,0.20), rgba(228,191,114,0.05) 44%, rgba(228,191,114,0) 74%);
  filter: blur(44px);
  clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
}
.beam--l { transform: translateX(-96%) rotate(-14deg); transform-origin: top center; }
.beam--r { transform: translateX(-4%) rotate(14deg); transform-origin: top center; }
.pool {
  position: absolute; left: 74%; top: 20%; width: 880px; aspect-ratio: 1.75;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(228,191,114,0.26), rgba(169,124,46,0.09) 38%, rgba(10,5,7,0) 68%);
  filter: blur(16px);
}
/* A gold hairline along the top edge — the pelmet above a stage. */
.pelmet { position: absolute; inset: 0 0 auto; height: 4px; background: linear-gradient(90deg, rgba(228,191,114,0), #e4bf72 22%, #f0d38f 50%, #e4bf72 78%, rgba(228,191,114,0)); }

.copy { position: relative; z-index: 1; width: 620px; display: flex; flex-direction: column; gap: 22px; }

.brand { display: flex; align-items: center; gap: 13px; }
.brand svg { width: 38px; height: 38px; }
.brand span { font-family: "Bodoni Moda", serif; font-size: 34px; font-weight: 600; letter-spacing: 0.005em; }

.eyebrow {
  font-size: 17px; font-weight: 500; letter-spacing: 0.2em;
  text-transform: uppercase; color: #e4bf72;
}

h1 {
  font-family: "Bodoni Moda", serif;
  font-size: 68px; font-weight: 500; line-height: 1.02; letter-spacing: -0.022em;
}
h1 em { font-style: italic; font-weight: 400; color: #e4bf72; }

.sub { font-size: 22px; font-weight: 300; line-height: 1.5; color: #c2afa8; max-width: 42ch; text-wrap: balance; }

.meta { display: flex; gap: 18px; align-items: center; font-size: 17px; color: #9f8e8a; font-variant-numeric: tabular-nums; }
.meta i { width: 4px; height: 4px; border-radius: 50%; background: #a97c2e; }

/* The phone is bled off the bottom on purpose: it reads as a real object
   standing in the light rather than a picture pasted onto a rectangle. */
.stage { position: relative; z-index: 1; flex: 1; display: flex; justify-content: center; align-self: stretch; align-items: flex-start; padding-top: 62px; }
.phone { width: 286px; }
.phone__body {
  position: relative; border-radius: 13.5%/6.4%; padding: 2.4%;
  background: linear-gradient(155deg, #4a3a30, #1a0f0c 34%, #120908 62%, #3b2c25);
  box-shadow:
    0 2px 2px rgba(245,237,228,0.10) inset,
    0 44px 92px -30px rgba(0,0,0,0.85),
    0 0 84px -20px rgba(228,191,114,0.42);
  transform: rotate(-5deg);
}
.phone__screen { position: relative; border-radius: 11.4%/5.4%; overflow: hidden; background: #0f0709; }
.phone__screen img { display: block; width: 100%; height: auto; }
.phone__glare {
  position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(118deg, rgba(245,237,228,0.11) 0%, rgba(245,237,228,0.02) 22%, rgba(245,237,228,0) 46%);
}
</style>
</head>
<body>

<div class="rig" aria-hidden="true">
  <div class="beam beam--l"></div>
  <div class="beam beam--r"></div>
  <div class="pool"></div>
</div>
<div class="pelmet" aria-hidden="true"></div>

<div class="copy">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M4 9H60V14Q46 23 32 15Q18 23 4 14Z" fill="#e4bf72"/>
      <path d="M6 15H23C20 27 20 41 22 51Q14 56 6 52Z" fill="#e4bf72"/>
      <path d="M58 15H41C44 27 44 41 42 51Q50 56 58 52Z" fill="#e4bf72"/>
      <path d="M32 26.5l2.06 5.67 6.02.2-4.75 3.71 1.67 5.8L32 38.5l-5 3.38 1.67-5.8-4.75-3.71 6.02-.2z" fill="#e4bf72"/>
    </svg>
    <span>Vastaps</span>
  </div>

  <p class="eyebrow">Magyar színházi napló</p>
  <h1>A magyar színház,<br><em>egy naplóban</em>.</h1>
  <p class="sub">Mi megy ma este, és mi volt az, amit tavaly láttál.</p>
  <p class="meta">
    <span>Budapest és Debrecen</span><i></i><span>Éjszakánként frissül</span>
  </p>
</div>

<div class="stage">
  <div class="phone">
    <div class="phone__body">
      <div class="phone__screen">
        <img id="shot" src="shots/discover.webp" width="810" height="1761" alt="">
        <span class="phone__glare"></span>
      </div>
    </div>
  </div>
</div>

<script>
/* The renderer waits on this. Screenshotting before the webfonts and the
   screenshot have landed bakes a fallback serif and an empty phone into a
   PNG that then sits in every link preview until someone notices. */
window.ogReady = (async () => {
  await document.fonts.ready;
  const img = document.getElementById("shot");
  if (!img.complete) {
    await new Promise((res) => { img.onload = res; img.onerror = res; });
  }
  return img.naturalWidth > 0;
})();
</script>
</body>
</html>
