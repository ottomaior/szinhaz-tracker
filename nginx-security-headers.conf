# The security headers every response from this host must carry.
#
# This is a separate file, included once per location block, for one reason:
# nginx does not inherit `add_header` downwards into a block that declares an
# `add_header` of its own. Every single location in nginx.conf sets its own
# Cache-Control, so a header written once at `server` level would reach nothing
# but the bare 404. Repeating six directives nine times by hand is how one of
# them quietly goes missing, so they live here and each block says `include`.
#
# The headers, and why each one:
#
#   X-Frame-Options / frame-ancestors — the app holds a signed-in session and
#   is never embedded anywhere. Without this, any site on the internet can put
#   web.vastaps.app in an invisible iframe and collect the clicks of someone
#   who thinks they are pressing something else.
#
#   X-Content-Type-Options — stops a browser guessing a type for a response
#   whose Content-Type it does not like. The user-uploaded images live on
#   Supabase's origin rather than this one, but the guarantee is cheap.
#
#   Referrer-Policy — a play or profile URL identifies what somebody went to
#   see. It should not travel in the Referer header to whatever they click
#   next.
#
#   Permissions-Policy — the web app asks for none of these. Saying so denies
#   them to anything that ends up running on the page.
#
#   Strict-Transport-Security — Railway already serves this host over HTTPS
#   only; this is what stops the very first request of a session being made in
#   the clear. No `preload`: that is a submission to a browser-vendor list
#   which is slow to leave, and it is not a decision to make as a side effect
#   of a header.
#
#   Cross-Origin-Opener-Policy — severs the window.opener link, so a page this
#   app opens cannot reach back and navigate it.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
