<!doctype html>
<meta charset="utf-8" />
<title>Vastaps — Play Store screenshots</title>
<!--
  The eight 1080x1920 frames Google Play shows under "Phone screenshots".

  Not the raw device captures. `landing/shots/*.webp` are 810x1761, which is
  taller than the 9:16 Play accepts, so they would be rejected on upload — and
  a bare screenshot is a weak listing anyway. Each frame here mounts one
  capture on the brand background under a line of Hungarian saying what the
  reader is looking at, which is the half a stranger scrolling the store
  actually reads.

  Rendered by `scripts/render-store.ts`; `?i=N` picks a frame.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Sora:wght@300;400;500;600&display=swap"
/>
<style>
  :root {
    --ink: #0a0507;
    --surface: #170b0f;
    --text: #f6efe6;
    --dim: #c2afa8;
    --gold: #e4bf72;
    --gold-lift: #f0d38f;
    --display: "Bodoni Moda", "Bodoni MT", Didot, "Times New Roman", serif;
    --sans: "Sora", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .frame {
    position: relative;
    width: 1080px;
    height: 1920px;
    display: none;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    /* The velvet the whole product is lit against: a warm pool up top where
       the words are, falling away to near-black behind the phone. */
    background:
      radial-gradient(120% 62% at 50% 4%, rgba(228, 191, 114, 0.16) 0%, rgba(228, 191, 114, 0) 62%),
      radial-gradient(150% 80% at 50% 0%, #2a1016 0%, #170b0f 46%, #0a0507 100%);
  }
  .frame.on { display: flex; }

  /* A single hairline of gold across the top, like a lit proscenium edge. */
  .frame::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold) 22%, var(--gold-lift) 50%, var(--gold) 78%, transparent);
    opacity: 0.75;
  }

  .caption { padding: 132px 88px 0; text-align: center; }

  .eyebrow {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 30px;
  }

  .line {
    font-family: var(--display);
    font-weight: 600;
    font-size: 76px;
    line-height: 1.1;
    color: var(--text);
    letter-spacing: -0.005em;
    text-wrap: balance;
  }

  .sub {
    margin-top: 26px;
    font-size: 31px;
    font-weight: 300;
    line-height: 1.45;
    color: var(--dim);
    text-wrap: balance;
  }

  .stage { position: relative; margin-top: auto; }

  /* The capture sits in a thin dark bezel so it reads as a phone rather than
     as a rectangle that happens to be a different colour from the page. */
  .phone {
    position: relative;
    width: 664px;
    padding: 12px;
    border-radius: 52px;
    background: linear-gradient(160deg, rgba(246, 239, 230, 0.16), rgba(246, 239, 230, 0.03) 40%, rgba(10, 5, 7, 0.5));
    box-shadow:
      0 -2px 60px -12px rgba(228, 191, 114, 0.3),
      0 40px 90px -30px rgba(0, 0, 0, 0.9);
  }
  .phone img {
    display: block;
    width: 100%;
    border-radius: 42px;
    /* The captures are 810x1761. Showing the top 86% keeps the header and the
       first rows of content large enough to read in a store thumbnail; the
       tail of a scrolling list adds nothing at this size. */
    aspect-ratio: 810 / 1510;
    object-fit: cover;
    object-position: top center;
  }
</style>

<body>
  <script>
    /**
     * Frame copy. Hungarian, because the listing is Hungarian and the app is
     * about Hungarian theatre — a translated caption over an untranslated
     * screenshot reads worse than no caption.
     *
     * Order matters: Play shows these in sequence and most people see the
     * first two. Those two are the promise ("what is on tonight") and the
     * point ("write down what you saw").
     */
    const FRAMES = [
      {
        shot: "musor.webp",
        eyebrow: "Műsor",
        line: "Ami ma este megy,<br />egy képernyőn.",
        sub: "Nyolc színház műsora Budapesten és Debrecenben, napra bontva.",
      },
      {
        shot: "feed.webp",
        eyebrow: "Napló",
        line: "Jegyezd fel,<br />amit láttál.",
        sub: "Öt maszk, három szempont, egy este — és évek múlva is tudni fogod, melyik volt az.",
      },
      {
        shot: "play.webp",
        eyebrow: "Előadás",
        line: "Az előadás<br />egy lapon.",
        sub: "Szereposztás, időpontok, értékelés. Kérj értesítést, ha új dátum kerül ki.",
      },
      {
        shot: "search.webp",
        eyebrow: "Keresés",
        line: "Ékezet nélkül is<br />megtalálja.",
        sub: "A „Csuja Imre” a színészre keres, nem a szavakra.",
      },
      {
        shot: "person.webp",
        eyebrow: "Alkotók",
        line: "Kövesd, akinek<br />a játékát szereted.",
        sub: "Szólunk, ha egy követett színész vagy rendező új előadásban lép színpadra.",
      },
      {
        shot: "user.webp",
        eyebrow: "Profil",
        line: "A profilod<br />egy műsorfüzet.",
        sub: "Az évadod egyben: minden este, amit végigültél.",
      },
      {
        shot: "discover.webp",
        eyebrow: "Felfedezés",
        line: "Nem darabok listája.<br />Estéké.",
        sub: "Műfaj, színház, terjedelem, rendezés — szűkítsd addig, amíg egy este marad.",
      },
      {
        shot: "list.webp",
        eyebrow: "Kívánságlista",
        line: "Amit még<br />meg akarsz nézni.",
        sub: "Egy koppintás a műsorból, és ott marad, amíg le nem ülsz a nézőtérre.",
      },
    ];

    const params = new URLSearchParams(location.search);
    const index = Math.min(Math.max(Number(params.get("i") ?? 0), 0), FRAMES.length - 1);
    const f = FRAMES[index];

    document.body.insertAdjacentHTML(
      "beforeend",
      `<div class="frame on">
         <div class="caption">
           <div class="eyebrow">${f.eyebrow}</div>
           <h1 class="line">${f.line}</h1>
           <p class="sub">${f.sub}</p>
         </div>
         <div class="stage">
           <div class="phone"><img src="../landing/shots/${f.shot}" alt="" /></div>
         </div>
       </div>`
    );

    /**
     * The renderer waits on this rather than on a fixed delay: the webfont
     * stylesheet is a network round trip, and a frame captured before Bodoni
     * Moda lands falls back to Times and looks like a different product.
     */
    window.storeReady = Promise.all([
      document.fonts.ready,
      ...[...document.images].map(
        (img) =>
          img.decode?.() ??
          new Promise((res) => {
            img.onload = img.onerror = res;
          })
      ),
    ]).then(() => true);
  </script>
</body>
